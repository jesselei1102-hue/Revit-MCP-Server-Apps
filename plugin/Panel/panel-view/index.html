<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MCP Agent Canvas — Model</title>
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' https://panel.local; connect-src https://panel.local; style-src 'unsafe-inline'; img-src data:;" />
<style>
  html, body { height: 100%; margin: 0; background: #101014; color: #e6e6e9;
               font: 12px/1.5 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #scene { position: absolute; inset: 0; }
  canvas { display: block; }
  .hud {
      position: absolute; left: 10px; top: 10px; padding: 8px 10px; border-radius: 8px;
      background: rgba(16, 16, 20, .78); border: 1px solid #26262e; backdrop-filter: blur(4px);
      pointer-events: none; user-select: none; max-width: 320px;
  }
  .hud h1 { font-size: 12px; letter-spacing: .4px; margin: 0 0 4px; font-weight: 600; color: #e8e8ec; }
  .hud div { color: #9a9aa2; }
  .hud code { background: #1c1c21; padding: 0 4px; border-radius: 3px; color: #c9c9d1; }
  .hud-toggle {
      pointer-events: auto; cursor: pointer; user-select: none;
      display: inline-block; margin-top: 4px; padding: 2px 8px; border-radius: 4px;
      border: 1px solid #2d2d34; background: rgba(255,255,255,.04); color: #d9d9e2; font-size: 11px;
  }
  .hud-toggle.active { border-color: #3f6a85; background: rgba(90, 214, 255, .12); color: #bfe9ff; }
  .hud-actions {
      pointer-events: auto; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
  }
  .hud-btn {
      cursor: pointer; user-select: none; border: 1px solid #2d2d34; border-radius: 5px;
      background: rgba(255,255,255,.06); color: #e4e4ea; font-size: 11px; padding: 4px 10px;
  }
  .hud-btn:hover { border-color: #3f6a85; background: rgba(90, 214, 255, .10); color: #dff3ff; }
  .hud-btn:disabled { opacity: .45; cursor: default; }
  .hud-btn.primary { border-color: #3f6a85; background: rgba(90, 214, 255, .14); color: #cfeeff; }
  .axes-note { position: absolute; right: 10px; top: 10px; color: #6b6b74; font-size: 11px; user-select: none; }
  .legend {
      position: absolute; left: 10px; bottom: 10px; padding: 8px 10px; border-radius: 8px;
      background: rgba(16, 16, 20, .82); border: 1px solid #26262e; backdrop-filter: blur(4px);
      user-select: none; max-width: 260px; display: none;
  }
  .legend h2 { font-size: 11px; margin: 0 0 6px; color: #d8d8de; font-weight: 600; letter-spacing: .3px; }
  .legend-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; color: #b9b9c2; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 2px; border: 1px solid rgba(255,255,255,.15); flex: none; }
  .legend-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
  <div id="scene"></div>
  <div class="hud">
    <h1>MCP Agent Canvas · model</h1>
    <div>drag = orbit · wheel = zoom · right-drag = pan · click = pick</div>
    <div id="status">initializing…</div>
    <div class="hud-actions">
      <button type="button" class="hud-btn primary" id="btn-load-view" title="Extract geometry from the active Revit 3D/view into this panel">Load Revit view</button>
      <button type="button" class="hud-btn" id="btn-send-capture" title="Snapshot this canvas and keep it for the agent / rendering model">Send capture</button>
    </div>
  </div>
  <div class="axes-note">x&nbsp;red · y&nbsp;green · z&nbsp;blue</div>
  <div class="legend" id="legend"><h2>Analysis</h2><div id="legend-body"></div></div>

      <script src="https://panel.local/vendor/three.min.js"></script>
  <script src="https://panel.local/vendor/controls/OrbitControls.js"></script>
  <script>
    (function () {
      var host = document.getElementById('scene');
      var status = document.getElementById('status');
      var legend = document.getElementById('legend');
      var legendBody = document.getElementById('legend-body');
      var btnLoadView = document.getElementById('btn-load-view');
      var btnSendCapture = document.getElementById('btn-send-capture');
      var bridge = window.chrome && window.chrome.webview ? window.chrome.webview : null;
      var loadInFlight = false;

      function setStatus(text, color) {
        status.textContent = text;
        status.style.color = color || '#9a9aa2';
      }
      function postToHost(type, payload) {
        if (!bridge) return;
        bridge.postMessage(Object.assign({ token: window.__panelToken || null, type: type }, payload || {}));
      }
      function fail(msg) {
            setStatus('error: ' + msg, '#c05a5a');
        postToHost('error', { message: msg });
      }

      if (typeof THREE === 'undefined') { fail('three.min.js did not load'); return; }

      var renderer;
      try {
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'default' });
      } catch (e) {
        fail(e && e.message ? e.message : String(e));
        return;
      }
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      renderer.setClearColor(0x101014, 1);          // dark backdrop, objects pop out in warm white
      renderer.outputEncoding = THREE.sRGBEncoding; // r128: no outputColorSpace yet
      if (THREE.ACESFilmicToneMapping !== undefined) {
        renderer.toneMapping = THREE.ACESFilmicToneMapping; // closest available to NeutralToneMapping in r128
        renderer.toneMappingExposure = 1.05;
      }
      renderer.setSize(host.clientWidth, host.clientHeight);
      host.appendChild(renderer.domElement);

      var scene = new THREE.Scene();
      // No fog: Revit world coordinates can be hundreds of feet away from origin.

      var camera = new THREE.PerspectiveCamera(32, host.clientWidth / host.clientHeight, 0.05, 5000);
      camera.position.set(6.2, 5.0, 7.4);
      camera.up.set(0, 0, 1);

      var controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.maxDistance = 500;
      controls.minDistance = 0.5;
      controls.update();

      scene.add(new THREE.HemisphereLight(0xffffff, 0x2a2a30, 1.1));
      var key = new THREE.DirectionalLight(0xffffff, 1.2);
      key.position.set(-35, 65, -45);
      scene.add(key);
      var fill = new THREE.DirectionalLight(0xffffff, 0.6);
      fill.position.set(40, 25, 20);
      scene.add(fill);

      var grid = new THREE.GridHelper(20, 20, 0x3a3a44, 0x1f1f26);
      grid.rotation.x = Math.PI / 2;
      scene.add(grid);

      var modelRoot = new THREE.Group();
      modelRoot.name = 'model-root';
      scene.add(modelRoot);

      var elementMeshes = [];
      var analysisByElementId = new Map();
      var pickedElementId = null;
      var lastTotals = { elementCount: 0, totalVertices: 0 };
      var edgeLayer = true;                         // hard-edge overlay on top of the solid mesh
      var edgeLineMaterial = null;

      // Remove every mesh (and its hard-edge overlay) that belongs to the given elementId.
      // Disposes geometry to avoid GPU-memory leaks on incremental sync.
      function removeElements(elementIds) {
        if (!elementIds || elementIds.length === 0) return;
        var idSet = new Set(elementIds.map(Number));

        for (var i = modelRoot.children.length - 1; i >= 0; i--) {
          var child = modelRoot.children[i];
          var victimId = null;
          if (child.userData && child.userData.elementId != null) victimId = Number(child.userData.elementId);
          else if (child.userData && child.userData.sourceElementId != null) victimId = Number(child.userData.sourceElementId);
          if (victimId != null && idSet.has(victimId)) {
            modelRoot.remove(child);
            if (child.geometry) child.geometry.dispose();
            if (child.material) {
              if (Array.isArray(child.material)) child.material.forEach(function (m) { m.dispose(); });
              else if (child.material !== edgeLineMaterial) child.material.dispose();
            }
          }
        }

        elementMeshes = elementMeshes.filter(function (entry) {
          return !idSet.has(Number(entry.elementId));
        });

        if (pickedElementId != null && idSet.has(Number(pickedElementId))) {
          pickedElementId = null;
        }

        idSet.forEach(function (id) {
          if (analysisByElementId.has(id)) analysisByElementId.delete(id);
        });
      }

      // Build one Three.js mesh (+ edge overlay) for a single element from a packed buffer.
      // Returns null when the element has no usable triangles.
      function buildElementObject(element, positions, indices, useEdgeOverlay) {
        var elementId = Number(element.elementId);
        var firstVertex = Number(element.firstVertex) || 0;
        var vertexCount = Number(element.vertexCount) || 0;
        var firstIndex = Number(element.firstIndex) || 0;
        var indexCount = Number(element.indexCount) || 0;
        if (vertexCount <= 0 || indexCount <= 0) return null;

        var geometry = new THREE.BufferGeometry();
        var start = firstVertex * 3;
        var end = start + vertexCount * 3;
        geometry.setAttribute('position', new THREE.BufferAttribute(positions.subarray(start, end), 3));

        var localIndices = new Uint32Array(indexCount);
        for (var i = 0; i < indexCount; i++) {
          localIndices[i] = indices[firstIndex + i] - firstVertex;
        }
        geometry.setIndex(new THREE.BufferAttribute(localIndices, 1));
        geometry.computeVertexNormals();

        var isGlazed = Boolean(element.isGlazed);
        var mesh = new THREE.Mesh(geometry, materialForElement(elementId, element.category, isGlazed));
        mesh.userData.elementId = elementId;
        mesh.userData.name = element.name || '';
        mesh.userData.category = element.category || '';
        mesh.userData.isGlazed = isGlazed;

        var entry = { mesh: mesh, elementId: elementId, category: element.category || '', isGlazed: isGlazed };

        if (useEdgeOverlay) {
          try {
            var edges = new THREE.EdgesGeometry(geometry, 15);
            if (!edgeLineMaterial) {
              edgeLineMaterial = new THREE.LineBasicMaterial({
                color: 0x1e1e22,
                transparent: true,
                opacity: 0.4,
              });
            }
            var lines = new THREE.LineSegments(edges, edgeLineMaterial);
            lines.userData.sourceElementId = elementId;
            modelRoot.add(lines);
          } catch (e) {
            // Edge overlay is best-effort.
          }
        }

        modelRoot.add(mesh);
        return entry;
      }

      function applyGeometryDelta(message) {
        var payload = message || {};
        var deletedIds = Array.isArray(payload.deletedIds) ? payload.deletedIds : [];
        var removed = 0;

        removeElements(deletedIds);

        var url = payload.url;
        var done = function (addedCount) {
          // Rebuild material state so analysis colors and pick highlight reflect
          // any meshes removed above; newly added meshes already carry correct materials.
          rebuildMaterials();
          setStatus('sync: -' + deletedIds.length + ' +' + addedCount
            + ' · elements: ' + elementMeshes.length);
          postToHost('log', { message: 'geometry delta applied', deleted: deletedIds.length, added: addedCount });
        };

        if (!url) {
          done(0);
          return;
        }

        fetch(url, { cache: 'no-store' })
          .then(function (response) {
            if (!response.ok) throw new Error('fetch failed: ' + response.status);
            return response.json();
          })
          .then(function (payload) {
            if (!payload || payload.format !== 'panel-mesh-delta-v1') {
              throw new Error('unexpected delta format');
            }

            var positions = decodeBase64Float32(payload.positionsB64 || '');
            var indices = decodeBase64Uint32(payload.indicesB64 || '');
            var elements = Array.isArray(payload.elements) ? payload.elements : [];

            // Replace: drop any previous geometry for these element ids first.
            var upsertIds = elements.map(function (element) { return Number(element.elementId); });
            removeElements(upsertIds);

            var added = 0;
            elements.forEach(function (element) {
              var entry = buildElementObject(element, positions, indices, edgeLayer);
              if (entry) {
                elementMeshes.push(entry);
                added += 1;
              }
            });

            lastTotals = {
              elementCount: elementMeshes.length,
              totalVertices: elementMeshes.reduce(function (sum, entry) {
                return sum + (entry.mesh.geometry.attributes.position.count || 0);
              }, 0),
            };

            done(added);
          })
          .catch(function (error) {
            fail(error && error.message ? error.message : String(error));
          });
      }

      function clearModel() {
        pickedElementId = null;
        for (var i = modelRoot.children.length - 1; i >= 0; i--) {
          var child = modelRoot.children[i];
          modelRoot.remove(child);
          if (child.geometry) child.geometry.dispose();
          if (child.material) {
            if (Array.isArray(child.material)) child.material.forEach(function (m) { m.dispose(); });
            else child.material.dispose();
          }
        }
        // also clear edge overlays (they are separate children of modelRoot)
        elementMeshes = [];
      }

      function decodeBase64Float32(base64) {
        var binary = atob(base64);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return new Float32Array(bytes.buffer);
      }

      function decodeBase64Uint32(base64) {
        var binary = atob(base64);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return new Uint32Array(bytes.buffer);
      }

      function hashColor(elementId) {
        var seed = (Number(elementId) * 2654435761) >>> 0;
        var r = 80 + (seed & 0x7f);
        var g = 80 + ((seed >>> 7) & 0x7f);
        var b = 80 + ((seed >>> 14) & 0x7f);
        return (r << 16) | (g << 8) | b;
      }

      // Dark backdrop + warm white model. Category-based palette for legibility.
      // Roof: near-white warm. Roads/paving/site (Parking / Roads): mid-gray. Vegetation: green.
      // Everything else: warm white with a faint warm emissive so it pops against the dark bg.
      var WHITE_MODEL_FACADE = 0xffffff;
      var WHITE_MODEL_ROOF   = 0xfaf9f7;
      var WHITE_MODEL_GLAZED = 0x9ed8ff;
      var WHITE_MODEL_ROAD   = 0x5a5a60;               // asphalt-like darker gray
      var WHITE_MODEL_GREEN  = 0x3d7a3a;               // vegetation
      var WHITE_MODEL_EMISSIVE = 0x2a2418;             // faint warm self-bounce (keeps large flat faces from flattening to pure gray)
      var WHITE_MODEL_EMISSIVE_INTENSITY = 0.35;

      function categoryMatches(catLower, needles) {
        for (var i = 0; i < needles.length; i++) {
          if (catLower.indexOf(needles[i]) !== -1) return true;
        }
        return false;
      }

      function baseColorForElement(category) {
        var c = (category || '').toString().toLowerCase();
        // vegetation / green site elements
        if (categoryMatches(c, ['vegetation', 'planting', 'tree', 'shrub', 'green'])) return WHITE_MODEL_GREEN;
        // roads / paving / parking / site hardscape
        if (categoryMatches(c, ['parking', 'road', 'paving', 'pavement', 'asphalt', 'site', 'hardscape', 'curb'])) return WHITE_MODEL_ROAD;
        // roofs slightly less emissive-sounding but nearly indistinguishable from facade due to emissive; kept for semantic parity
        if (c.indexOf('roof') !== -1) return WHITE_MODEL_ROOF;
        return WHITE_MODEL_FACADE;
      }

      function materialForElement(elementId, category, isGlazed) {
        var analysis = analysisByElementId.get(Number(elementId));
        var isPicked = pickedElementId != null && Number(elementId) === Number(pickedElementId);
        var color;
        if (isPicked) {
          color = 0x2bd2ff; // bright cyan highlight for the element picked in this panel
        } else if (analysis && analysis.color) {
          var parsed = parseColor(analysis.color);
          color = parsed != null ? parsed : baseColorForElement(category);
        } else if (analysis && analysis.status) {
          color = statusColor(analysis.status);
        } else if (isGlazed) {
          color = WHITE_MODEL_GLAZED;
        } else {
          color = baseColorForElement(category);
        }

        var transparent = Boolean(isGlazed && !isPicked && !analysis);
        var highlighted = isPicked;
        return new THREE.MeshStandardMaterial({
          color: color,
          roughness: 0.9,
          metalness: 0.0,
          emissive: highlighted ? 0x0b5a7a : WHITE_MODEL_EMISSIVE,
          emissiveIntensity: highlighted ? 0.9 : (analysis ? 0.0 : WHITE_MODEL_EMISSIVE_INTENSITY),
          flatShading: false,
          transparent: transparent,
          opacity: transparent ? 0.35 : 1.0,
          depthWrite: !transparent,
          side: transparent ? THREE.DoubleSide : THREE.FrontSide,
        });
      }

      function parseColor(input) {
        if (!input) return null;
        var value = String(input).trim();
        if (/^#([0-9a-f]{6})$/i.test(value)) return parseInt(value.slice(1), 16);
        if (/^#([0-9a-f]{3})$/i.test(value)) {
          var h = value.slice(1);
          return parseInt(h[0] + h[0] + h[1] + h[1] + h[2] + h[2], 16);
        }
        var rgb = value.match(/^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i);
        if (rgb) {
          return ((Number(rgb[1]) & 255) << 16) | ((Number(rgb[2]) & 255) << 8) | (Number(rgb[3]) & 255);
        }
        var named = {
          red: 0xe05a5a, green: 0x4fbb6a, blue: 0x4f86d8, amber: 0xe8b54a,
          yellow: 0xe6d84f, orange: 0xe08a3c, pass: 0x4fbb6a, fail: 0xe05a5a, warn: 0xe8b54a,
        };
        var key = value.toLowerCase();
        return Object.prototype.hasOwnProperty.call(named, key) ? named[key] : null;
      }

      function statusColor(status) {
        switch (String(status).toLowerCase()) {
          case 'pass':
          case 'ok':
          case 'green':
            return 0x4fbb6a;
          case 'fail':
          case 'error':
          case 'red':
            return 0xe05a5a;
          case 'warn':
          case 'warning':
          case 'amber':
          case 'yellow':
            return 0xe8b54a;
          default:
            return 0x8f95a8;
        }
      }

      function rebuildMaterials() {
        elementMeshes.forEach(function (entry) {
          if (entry.mesh.material) entry.mesh.material.dispose();
          entry.mesh.material = materialForElement(entry.elementId, entry.category, entry.isGlazed);
        });
        renderLegend();
      }

      function renderLegend() {
        if (analysisByElementId.size === 0) {
          legend.style.display = 'none';
          legendBody.innerHTML = '';
          return;
        }

        var counts = new Map();
        analysisByElementId.forEach(function (entry) {
          var label = entry.label || entry.status || entry.color || 'item';
          var key = String(label);
          var rawColor = entry.color;
          var swatch = null;
          if (rawColor) {
            var parsed = parseColor(rawColor);
            if (parsed != null) swatch = '#' + Number(parsed).toString(16).padStart(6, '0');
          }
          if (!swatch && entry.status) {
            swatch = '#' + statusColor(entry.status).toString(16).padStart(6, '0');
          }
          if (!swatch) swatch = '#8f95a8';
          var current = counts.get(key) || { label: label, color: swatch, count: 0 };
          current.count += 1;
          counts.set(key, current);
        });

        legendBody.innerHTML = '';
        counts.forEach(function (item) {
          var row = document.createElement('div');
          row.className = 'legend-row';
          var swatch = document.createElement('span');
          swatch.className = 'legend-swatch';
          swatch.style.background = item.color;
          var label = document.createElement('span');
          label.className = 'legend-label';
          label.textContent = item.label + ' · ' + item.count;
          row.appendChild(swatch);
          row.appendChild(label);
          legendBody.appendChild(row);
        });
        legend.style.display = 'block';
      }

      function loadGeometry(url) {
        setStatus('loading geometry…');
        return fetch(url, { cache: 'no-store' })
          .then(function (response) {
            if (!response.ok) throw new Error('fetch failed: ' + response.status);
            return response.json();
          })
          .then(function (payload) {
            if (!payload || payload.format !== 'panel-mesh-v1') {
              throw new Error('unexpected geometry format');
            }

            var positions = decodeBase64Float32(payload.positionsB64 || '');
            var indices = decodeBase64Uint32(payload.indicesB64 || '');
            var elements = Array.isArray(payload.elements) ? payload.elements : [];

            clearModel();

            elements.forEach(function (element) {
              var entry = buildElementObject(element, positions, indices, edgeLayer);
              if (entry) elementMeshes.push(entry);
            });

            lastTotals = {
              elementCount: payload.elementCount || elements.length,
              totalVertices: payload.totalVertices || (positions.length / 3),
            };

            fitCameraToModel();
            setStatus('elements: ' + lastTotals.elementCount
              + ' · verts: ' + lastTotals.totalVertices
              + (payload.truncated ? ' · truncated' : ''));
            postToHost('log', { message: 'geometry loaded', elementCount: lastTotals.elementCount });
          })
          .catch(function (error) {
            fail(error && error.message ? error.message : String(error));
          });
      }

      function fitCameraToModel() {
        if (elementMeshes.length === 0) {
          camera.position.set(6.2, 5.0, 7.4);
          controls.target.set(0, 0, 0);
          controls.update();
          return;
        }

        var box = new THREE.Box3();
        elementMeshes.forEach(function (entry) {
          box.expandByObject(entry.mesh);
        });

        if (box.isEmpty()) {
          controls.target.set(0, 0, 0);
          controls.update();
          return;
        }

        var center = box.getCenter(new THREE.Vector3());
        var size = box.getSize(new THREE.Vector3());
        var radius = Math.max(size.x, size.y, size.z, 1) * 0.7;

        controls.target.copy(center);
        camera.position.set(center.x + radius, center.y - radius, center.z + radius * 0.8);
        camera.near = Math.max(radius / 1000, 0.05);
        camera.far = Math.max(radius * 50, 2000);
        camera.updateProjectionMatrix();
        controls.update();
      }

      function pickAny(obj, names) {
        if (!obj) return null;
        for (var i = 0; i < names.length; i++) {
          var value = obj[names[i]];
          if (value != null) return value;
        }
        return null;
      }

      function applyAnalysis(items) {
        analysisByElementId.clear();
        (items || []).forEach(function (item) {
          var rawId = pickAny(item, ['elementId', 'ElementId', 'Id']);
          var elementId = Number(rawId);
          if (!Number.isFinite(elementId) || elementId <= 0) return;
          var color = pickAny(item, ['color', 'Color']);
          var status = pickAny(item, ['status', 'Status']);
          var label = pickAny(item, ['label', 'Label']);
          analysisByElementId.set(elementId, {
            color: color != null ? String(color) : null,
            status: status != null ? String(status) : null,
            label: label != null ? String(label) : null,
          });
        });
        rebuildMaterials();
        setStatus('analysis applied: ' + analysisByElementId.size + ' item(s)');
      }

      function clearAnalysis() {
        analysisByElementId.clear();
        rebuildMaterials();
        setStatus('analysis cleared');
      }

      function clear(target) {
        var normalized = String(target || 'all').toLowerCase();
        if (normalized === 'model' || normalized === 'all') {
          pickedElementId = null;
          clearModel();
          lastTotals = { elementCount: 0, totalVertices: 0 };
        }
        if (normalized === 'analysis' || normalized === 'all' || normalized === 'model') {
          clearAnalysis();
        }
        setStatus('cleared: ' + normalized);
      }

      var raycaster = new THREE.Raycaster();
      var pointer = new THREE.Vector2();
      var downPosition = null;

      renderer.domElement.addEventListener('pointerdown', function (event) {
        downPosition = { x: event.clientX, y: event.clientY };
      });

      renderer.domElement.addEventListener('pointerup', function (event) {
        if (!downPosition) return;
        var dx = event.clientX - downPosition.x;
        var dy = event.clientY - downPosition.y;
        downPosition = null;
        if (dx * dx + dy * dy > 16) return; // drag, not click

        var rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);

        var hits = raycaster.intersectObjects(modelRoot.children, false);
        if (hits.length === 0) {
          if (pickedElementId != null) {
            pickedElementId = null;
            rebuildMaterials();
          }
          return;
        }

        var elementId = hits[0].object.userData.elementId;
        if (elementId) {
          pickedElementId = Number(elementId);
          rebuildMaterials();
          postToHost('pick', { elementId: Number(elementId) });
          setStatus('picked element ' + elementId);
        }
      });

      if (bridge) {
        bridge.addEventListener('message', function (event) {
          var message = event.data;
          try {
            if (typeof message === 'string') message = JSON.parse(message);
          } catch (error) {
            return;
          }

          if (!message || typeof message !== 'object') return;
          window.__panelToken = message.token || window.__panelToken || null;
          var payload = message.payload || {};

          switch (message.type) {
            case 'geometry_ready':
              loadGeometry(payload.url);
              break;
            case 'geometry_delta':
              applyGeometryDelta(payload);
              break;
            case 'set_analysis':
              applyAnalysis(payload.items || []);
              break;
            case 'clear_analysis':
              clearAnalysis();
              break;
            case 'clear':
              clear(payload.target || 'all');
              break;
            case 'clear_analysis':
              clearAnalysis();
              break;
            case 'fit':
              fitCameraToModel();
              break;
            case 'capture':
              handleCapture(payload || {});
              break;
            case 'load_geometry_progress':
              setStatus(payload.message || 'extracting…', '#9a9aa2');
              break;
            case 'load_geometry_result':
              loadInFlight = false;
              if (btnLoadView) btnLoadView.disabled = false;
              if (payload && payload.ok) {
                setStatus('loaded from Revit · ' + (payload.viewName || 'view')
                  + ' · ' + (payload.elementCount || 0) + ' elements'
                  + (payload.truncated ? ' · truncated' : ''), '#7dcea0');
              } else {
                setStatus('load failed: ' + ((payload && (payload.message || payload.error)) || 'unknown'), '#c05a5a');
              }
              break;
            case 'status':
              postToHost('log', { message: 'status requested' });
              break;
            default:
              break;
          }
        });
      }

      if (btnLoadView) {
        btnLoadView.addEventListener('click', function () {
          if (loadInFlight) return;
          if (!bridge) {
            setStatus('error: no host bridge', '#c05a5a');
            return;
          }
          loadInFlight = true;
          btnLoadView.disabled = true;
          setStatus('requesting Revit view…');
          postToHost('request_geometry', {});
        });
      }

      if (btnSendCapture) {
        btnSendCapture.addEventListener('click', function () {
          try {
            var result = captureFrame({
              format: 'jpeg',
              quality: 0.9,
              maxWidth: 1600,
              maxHeight: 1600,
            });
            result.source = 'user';
            postToHost('user_capture', result);
            setStatus('capture sent · ' + result.width + '×' + result.height, '#7dcea0');
          } catch (error) {
            setStatus('capture failed: ' + (error && error.message ? error.message : String(error)), '#c05a5a');
            postToHost('user_capture', {
              ok: false,
              source: 'user',
              error: 'capture_failed',
              message: error && error.message ? error.message : String(error),
            });
          }
        });
      }

      function handleCapture(payload) {
        var requestId = payload.requestId || null;
        try {
          var result = captureFrame(payload);
          result.requestId = requestId;
          postToHost('capture_result', result);
        } catch (error) {
          postToHost('capture_result', {
            requestId: requestId,
            ok: false,
            error: 'capture_failed',
            message: error && error.message ? error.message : String(error),
          });
        }
      }

      /**
       * Snapshot the current WebGL view for MCP / rendering models.
       * Returns base64 without a data: URL prefix.
       */
      function captureFrame(opts) {
        opts = opts || {};
        var format = String(opts.format || 'png').toLowerCase();
        var mime = (format === 'jpeg' || format === 'jpg' || format === 'image/jpeg')
          ? 'image/jpeg'
          : 'image/png';
        var quality = typeof opts.quality === 'number' ? opts.quality : 0.9;
        if (quality < 0.1) quality = 0.1;
        if (quality > 1) quality = 1;

        controls.update();
        renderer.render(scene, camera);

        var source = renderer.domElement;
        var width = source.width;
        var height = source.height;
        var maxWidth = typeof opts.maxWidth === 'number' ? opts.maxWidth : 0;
        var maxHeight = typeof opts.maxHeight === 'number' ? opts.maxHeight : 0;
        var canvas = source;

        if ((maxWidth > 0 && width > maxWidth) || (maxHeight > 0 && height > maxHeight)) {
          var scale = Math.min(
            maxWidth > 0 ? maxWidth / width : 1,
            maxHeight > 0 ? maxHeight / height : 1
          );
          var tw = Math.max(1, Math.round(width * scale));
          var th = Math.max(1, Math.round(height * scale));
          var off = document.createElement('canvas');
          off.width = tw;
          off.height = th;
          off.getContext('2d').drawImage(source, 0, 0, tw, th);
          canvas = off;
          width = tw;
          height = th;
        }

        var dataUrl = canvas.toDataURL(mime, quality);
        var comma = dataUrl.indexOf(',');
        var dataBase64 = comma >= 0 ? dataUrl.slice(comma + 1) : dataUrl;

        return {
          ok: true,
          mimeType: mime,
          width: width,
          height: height,
          dataBase64: dataBase64,
          byteLength: Math.floor(dataBase64.length * 0.75),
          elementCount: lastTotals.elementCount || 0,
          totalVertices: lastTotals.totalVertices || 0,
          camera: {
            position: [camera.position.x, camera.position.y, camera.position.z],
            target: [controls.target.x, controls.target.y, controls.target.z],
            up: [camera.up.x, camera.up.y, camera.up.z],
            fov: camera.fov,
            near: camera.near,
            far: camera.far,
          },
        };
      }

      // Callable from host script injection if needed.
      window.__panelCapture = captureFrame;

      function resize() {
        var w = host.clientWidth, h = host.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
      window.addEventListener('resize', resize);

      var frames = 0;
      function tick() {
        requestAnimationFrame(tick);
        controls.update();
        renderer.render(scene, camera);
        if (frames < 2) {
          frames += 1;
          if (frames === 2) {
            setStatus('ready · ' + (renderer.capabilities.isWebGL2 ? 'webgl2' : 'webgl1'));
            postToHost('ready', {});
          }
        }
      }
      tick();
    })();
  </script>
</body>
</html>
