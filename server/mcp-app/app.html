<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MCP Apps · Revit Schedule</title>
  <!-- Ultraviolet tokens, copied from the theme repo: npm run theme:sync / theme:check -->
  <link rel="stylesheet" href="./theme/tokens.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* No min-height here: hosts auto-size the iframe to the content, and a viewport-relative minimum
       would stop the frame from ever shrinking (e.g. switching from Elements to Checks). */
    html, body { background: var(--bg); }
    body {
      font-family: var(--font-sans, var(--font-family, ui-sans-serif, system-ui, sans-serif));
      font-size: 13px;
      line-height: 1.4;
      color: var(--tx);
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .mono { font-family: var(--mono); }
    /* Browser surfaces in the palette: selection, caret, scrollbars. */
    ::selection { background: var(--accent-hl); color: var(--hl-tx); }
    input { caret-color: var(--accent); }
    * { scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
    *:hover { scrollbar-color: var(--tx3) transparent; }
    svg.i { width: 14px; height: 14px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    [hidden] { display: none !important; }

    .app { position: relative; display: flex; flex-direction: column; }
    /* The orbit stays in the header: below the tab line it would run through the toolbar controls. */
    .orbit-clip { position: absolute; inset: 0 0 auto 0; height: 96px; overflow: hidden; pointer-events: none; }
    .orbit { position: absolute; right: -70px; top: -80px; pointer-events: none; }
    .orbit .o1 { stroke: var(--line2); }
    .orbit .o2 { stroke: var(--line); }
    .orbit .o3 { fill: var(--accent); }
    .orbit .o4 { fill: var(--accent); opacity: 0.12; }

    /* ---------- Header ---------- */
    .top {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px 0;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand .logo-ring { stroke: var(--tx); }
    .brand .logo-dot { fill: var(--accent); }
    .brand h1 { font-size: 16px; font-weight: 400; letter-spacing: -0.01em; }
    .meta {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--tx3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 52vw;
    }
    .top-actions { display: flex; gap: 4px; }
    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 99px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--tx2);
      border: 0.5px solid var(--line2);
      background: var(--bg);
    }
    .icon-btn:hover { color: var(--tx); border-color: var(--tx3); }
    .icon-btn.spin svg { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- Stats ---------- */
    .stats {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: 14px 36px;
      padding: 20px 20px 16px;
    }
    .stat b {
      display: block;
      font-family: var(--mono);
      font-size: 26px;
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .stat span { font-family: var(--mono); font-size: 11px; color: var(--tx3); }
    .sig {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
      background: var(--accent);
      box-shadow: var(--glow);
    }
    .sig.danger { background: var(--danger); box-shadow: none; }
    .stat.idle .sig { display: none; }

    /* ---------- Tabs ---------- */
    .tabs {
      position: relative;
      display: flex;
      gap: 26px;
      margin: 0 20px;
      border-bottom: 0.5px solid var(--line);
    }
    .tab {
      position: relative;
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      padding: 10px 0;
      color: var(--tx3);
      font-size: 13px;
    }
    .tab:hover { color: var(--tx2); }
    .tab .tab-count { font-family: var(--mono); font-size: 11px; color: var(--tx3); font-variant-numeric: tabular-nums; }
    .tab.on { color: var(--tx); }
    .tab.on::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background: var(--accent);
      box-shadow: var(--glow);
    }
    .tab .tab-count.hot { color: var(--accent-tx); }

    .panel { position: relative; flex: 1 1 auto; }

    /* ---------- Toolbar ---------- */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 14px 20px 10px;
    }
    .search {
      flex: 1 1 180px;
      margin-right: 8px;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 0.5px solid var(--line2);
      color: var(--tx3);
    }
    .search:focus-within { border-bottom-color: var(--accent); color: var(--tx2); }
    .search input {
      flex: 1 1 auto;
      min-width: 0;
      font: inherit;
      font-size: 13px;
      color: var(--tx);
      background: transparent;
      border: 0;
      outline: none;
      padding: 7px 0;
    }
    .search input::placeholder { color: var(--tx3); }
    /* Small actions (clear, import, ask agent): accent text so they read as something to press, not a caption. */
    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--accent-tx);
      white-space: nowrap;
      padding: 4px 2px;
    }
    .text-link:hover { color: var(--tx); }

    /* Filter dropdowns and the Columns button share one pill shape; a set filter fills in like a chosen chip. */
    .pick, .pill {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      border-radius: 99px;
      border: 0.5px solid var(--line2);
      font-size: 12px;
      color: var(--tx2);
      white-space: nowrap;
    }
    .pick:hover, .pill:hover, .pop-wrap.open > .pill { color: var(--tx); border-color: var(--tx3); }
    .pick select {
      appearance: none;
      max-width: 150px;
      height: 100%;
      font: inherit;
      color: inherit;
      background: transparent;
      border: 0;
      border-radius: inherit;
      padding: 0 28px 0 12px;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .pick select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .pick select option { color: var(--tx); background: var(--bg); }
    .pick svg { position: absolute; right: 10px; width: 12px; height: 12px; pointer-events: none; }
    .pick.on { background: var(--tx); color: var(--bg); border-color: transparent; }
    .pick.on svg { color: var(--accent); }
    .pill { padding: 0 12px; }
    .pill svg { width: 13px; height: 13px; }
    .pill-count { font-family: var(--mono); font-size: 11px; color: var(--accent-tx); }

    .pop-wrap { position: relative; }
    .popover {
      display: none;
      position: absolute;
      z-index: 40;
      top: calc(100% + 8px);
      right: 0;
      width: 280px;
      padding: 12px;
      background: var(--bg);
      border: 0.5px solid var(--line2);
      border-radius: 14px;
      box-shadow: var(--pop-shadow);
      flex-direction: column;
      gap: 10px;
    }
    .pop-wrap.open .popover { display: flex; }
    .popover input[type="search"] {
      width: 100%;
      font: inherit;
      font-family: var(--font-sans, ui-sans-serif, system-ui, sans-serif);
      font-size: 13px;
      color: var(--tx);
      background: var(--s1);
      border: 0.5px solid var(--line);
      border-radius: 8px;
      padding: 6px 8px;
      outline: none;
    }
    .popover input[type="search"]:focus { border-color: var(--accent); }
    .pop-actions { display: flex; justify-content: space-between; gap: 8px; }

    .ms-list { list-style: none; overflow: auto; max-height: 220px; margin: 0 -4px; }
    .ms-list li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 6px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .ms-list li:hover { background: var(--s1); }
    .ms-list li input { accent-color: var(--accent); flex: 0 0 auto; }
    .ms-list li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .ms-empty { padding: 8px 6px; font-size: 12px; color: var(--tx3); cursor: default !important; }

    /* ---------- Chips ---------- */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 20px 12px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px;
      border-radius: 99px;
      border: 0.5px solid var(--line2);
      font-size: 12px;
      color: var(--tx2);
      white-space: nowrap;
    }
    .chip:hover { color: var(--tx); border-color: var(--tx3); }
    .chip .glyph { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.4; flex: 0 0 auto; }
    .chip .count { font-family: var(--mono); font-size: 11px; opacity: 0.6; font-variant-numeric: tabular-nums; }
    .chip.on { background: var(--tx); color: var(--bg); border-color: transparent; }
    .chip.on .glyph { stroke: var(--accent); }
    .chip.ghost { border-style: dashed; }

    /* ---------- Table ---------- */
    #table-container {
      overflow: auto;
      /* Rows are re-rendered as you scroll; anchoring would fight that and make the list jump. */
      overflow-anchor: none;
      max-height: 460px;
      border-top: 0.5px solid var(--line);
    }
    .empty {
      padding: 36px 20px;
      text-align: center;
      color: var(--tx2);
    }
    .empty b { display: block; font-weight: 400; color: var(--tx); margin-bottom: 4px; }
    .empty span { font-size: 12px; }
    /* Figures line up down a column (Mark, counts, levels). */
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    /* The grid takes focus as one piece; the selected cell shows where the keyboard is. */
    #table-container table:focus { outline: none; }
    #table-container table:focus-visible td.cell-selected { outline-width: 2px; outline-offset: -2px; }
    th {
      position: sticky;
      top: 0;
      z-index: 4;
      text-align: left;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 400;
      color: var(--tx2);
      background: var(--bg);
      padding: 9px 12px 7px;
      border-bottom: 0.5px solid var(--line);
      white-space: nowrap;
    }
    /* Marks the columns you can change, so editing is discoverable without hovering. */
    th .edit-mark { width: 11px; height: 11px; margin-left: 5px; vertical-align: -1px; color: var(--accent-tx); }
    td {
      position: relative;
      padding: 9px 12px;
      border-bottom: 0.5px solid var(--line);
      vertical-align: middle;
      white-space: nowrap;
    }
    /* One fixed row pitch (host and linked rows alike): the table is windowed and spacer rows stand in
       for the rest, so every row has to be the height the spacers assume. Keep in step with rowHeight. */
    tbody tr[data-row-index] { height: 40px; }
    tr.spacer td { padding: 0; border: 0; }
    th.check-col, td.check-col { width: 44px; padding-left: 20px; padding-right: 4px; }
    td.check-col input, th.check-col input { accent-color: var(--accent); width: 13px; height: 13px; cursor: pointer; }
    tbody tr[data-row-index]:hover td { background: var(--s1); }
    tr.sel td { background: var(--accent-soft); }
    tr.sel td.check-col { box-shadow: inset 2px 0 0 var(--accent); }
    td.muted, .readonly { color: var(--tx3); }
    td .lock { color: var(--tx3); width: 13px; height: 13px; }
    td.level-cell { font-family: var(--mono); font-size: 12px; color: var(--tx2); }
    .cat-cell { display: inline-flex; align-items: center; gap: 6px; color: var(--tx2); }
    .cat-cell .glyph { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.4; }

    .family-cell, .param-cell { min-width: 130px; max-width: 280px; }
    .param-cell.editable { cursor: text; }
    /* Hovering a value you can edit shows the field it becomes. */
    .param-cell.editable:hover:not(.cell-selected) { box-shadow: inset 0 0 0 1px var(--line2); }
    .edit-scope {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--mono);
      font-size: 10px;
      padding: 1px 7px;
      border-radius: 99px;
      background: var(--accent);
      color: var(--on-accent);
      pointer-events: none;
    }
    .param-cell .cell-value { display: block; min-height: 1.2em; overflow: hidden; text-overflow: ellipsis; }
    .param-cell .cell-value:empty::before { content: "·"; color: var(--tx3); }
    .hl {
      background: var(--accent-hl);
      color: var(--hl-tx);
      padding: 1px 6px;
      margin-left: -6px;
      border-radius: 4px;
    }
    .param-cell input.cell-edit {
      width: 100%;
      font: inherit;
      font-size: 13px;
      color: var(--tx);
      background: transparent;
      border: 0;
      outline: none;
    }
    .type-face {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      text-align: left;
      padding: 1px 0;
    }
    .type-face .label { overflow: hidden; text-overflow: ellipsis; }
    /* Always shown, faintly: the type is a dropdown, and it should look like one before you hover. */
    .type-face .chev { color: var(--tx3); opacity: 0.55; width: 12px; height: 12px; }
    .type-face:hover .chev, td.cell-selected .type-face .chev { opacity: 1; }
    .type-face:hover { color: var(--accent-tx); }

    td.cell-selected { outline: 1.5px solid var(--accent); outline-offset: -1.5px; }

    .fill-handle {
      position: absolute;
      right: -1px;
      bottom: -1px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-hl);
      opacity: 0;
      cursor: crosshair;
      z-index: 3;
    }
    :root[data-theme="dark"] .fill-handle { box-shadow: 0 0 10px var(--accent); }
    td.cell-selected .fill-handle,
    .param-cell.editable:hover .fill-handle,
    tr.dirty td.family-cell .fill-handle,
    td.family-cell:hover .fill-handle { opacity: 1; }
    td.family-cell .fill-handle.idle { display: none; }

    body.filling { cursor: crosshair; user-select: none; }
    body.filling .fill-handle { pointer-events: none; }
    body.filling td.cell-selected:not(.fill-source) { outline-color: transparent; }
    td.fill-source { outline: 1.5px solid var(--accent); outline-offset: -1.5px; }
    td.fill-range, td.fill-skip {
      background: var(--accent-soft) !important;
      box-shadow: inset 1.5px 0 0 var(--accent), inset -1.5px 0 0 var(--accent);
    }
    td.fill-range.fill-end, td.fill-skip.fill-end {
      box-shadow: inset 1.5px 0 0 var(--accent), inset -1.5px 0 0 var(--accent), inset 0 -1.5px 0 var(--accent);
    }
    td.fill-range.fill-start, td.fill-skip.fill-start {
      box-shadow: inset 1.5px 0 0 var(--accent), inset -1.5px 0 0 var(--accent), inset 0 1.5px 0 var(--accent);
    }
    td.fill-range > *, td.fill-skip > * { visibility: hidden; }
    td.fill-range::before, td.fill-skip::before {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      max-width: calc(100% - 24px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    td.fill-range::before { content: attr(data-fill-value); color: var(--accent-tx); font-style: italic; }
    td.fill-range[data-fill-old]::after {
      content: attr(data-fill-old);
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      color: var(--tx3);
      text-decoration: line-through;
      max-width: 45%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    td.fill-skip::before { content: attr(data-fill-skip); font-family: var(--mono); font-size: 11px; color: var(--tx3); }

    .fill-badge {
      position: fixed;
      z-index: 60;
      pointer-events: none;
      font-family: var(--mono);
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 99px;
      background: var(--accent);
      color: var(--on-accent);
      box-shadow: var(--glow);
      white-space: nowrap;
    }

    /* ---------- Type menu ---------- */
    #type-menu {
      position: fixed;
      z-index: 50;
      display: none;
      width: 260px;
      max-height: 240px;
      overflow: auto;
      padding: 4px;
      background: var(--bg);
      border: 0.5px solid var(--line2);
      border-radius: 12px;
      box-shadow: var(--pop-shadow);
    }
    #type-menu.open { display: block; }
    #type-menu .menu-status { padding: 8px; font-size: 12px; color: var(--tx3); }
    #type-menu .menu-hint { padding: 6px 8px 4px; font-size: 11px; color: var(--tx2); }
    #type-menu .menu-hint b { font-weight: 500; color: var(--accent-tx); }
    #type-menu button {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1px;
      width: 100%;
      text-align: left;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 12px;
    }
    #type-menu button small { color: var(--tx3); font-size: 11px; }
    #type-menu button:hover { background: var(--s1); }
    #type-menu button.on { background: var(--accent-soft); color: var(--accent-tx); }

    /* ---------- Changes panel ---------- */
    .changes { display: flex; flex-direction: column; gap: 6px; padding: 16px 20px; }
    .change {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 6px 10px 14px;
      border-radius: 12px;
      border: 0.5px solid var(--line);
    }
    .change .kind { font-family: var(--mono); font-size: 11px; color: var(--tx3); width: 44px; flex: 0 0 auto; }
    .change .what { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .change .what .hl { margin-left: 0; }
    .change .scope { font-family: var(--mono); font-size: 11px; color: var(--tx3); white-space: nowrap; }
    .change .remove { width: 26px; height: 26px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; color: var(--tx3); }
    .change .remove:hover { color: var(--tx); background: var(--s1); }

    /* ---------- Checks: model line, results, rules ---------- */
    .view { padding: 14px 20px 6px; display: flex; flex-direction: column; gap: 10px; }
    .view-part { display: flex; flex-direction: column; gap: 10px; }
    .model-line { font-family: var(--mono); font-size: 11px; color: var(--tx3); }
    .run-head { display: flex; flex-direction: column; gap: 2px; }
    .run-head b { font-weight: 500; }
    .sec-title { font-size: 14px; font-weight: 500; margin-top: 10px; }
    .notice.danger { color: var(--danger); }
    .lab {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--tx3);
      margin-top: 6px;
    }
    .card { border: 0.5px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .card-head b { font-weight: 500; }
    .dim { font-family: var(--mono); font-size: 11px; color: var(--tx3); }
    .fail-tx { font-family: var(--mono); font-size: 11px; color: var(--danger); }
    .rows { margin-top: 6px; }
    .line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 7px 0;
      border-bottom: 0.5px solid var(--line);
    }
    .line:last-child { border-bottom: 0; }
    .line > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .line .glyph { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.4; vertical-align: -1px; margin-right: 6px; color: var(--tx2); }
    .sev { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 7px; vertical-align: middle; background: var(--tx3); }
    .sev.error { background: var(--danger); }
    .sev.warning { background: var(--accent); box-shadow: var(--glow); }
    .tog {
      position: relative;
      flex: 0 0 auto;
      width: 28px;
      height: 16px;
      border-radius: 99px;
      background: var(--line2);
      transition: background 0.15s;
    }
    .tog::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--tx3);
      transition: transform 0.15s, background 0.15s;
    }
    .tog[aria-checked="true"] { background: var(--accent); box-shadow: var(--glow); }
    .tog[aria-checked="true"]::after { transform: translateX(12px); background: var(--on-accent); }
    .tog[aria-checked="mixed"] { background: var(--accent-hl); }
    .tog[aria-checked="mixed"]::after { transform: translateX(6px); background: var(--accent); }
    .exp { display: inline-flex; align-items: center; gap: 4px; color: var(--tx); text-align: left; padding: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .exp .disc { width: 12px; height: 12px; color: var(--tx3); transition: transform 0.15s; }
    .exp[aria-expanded="true"] .disc { transform: rotate(90deg); }
    .exp:hover { color: var(--accent-tx); }
    .line.indent { padding-left: 16px; }
    .rules { padding-left: 28px; border-left: 0.5px solid var(--line); margin-left: 6px; }
    .rule-line { font-size: 12px; }
    .rule-ctl { display: inline-flex; align-items: center; gap: 8px; }
    .sev-select {
      font: inherit;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--tx2);
      background: transparent;
      border: 0.5px solid var(--line2);
      border-radius: 6px;
      padding: 1px 4px;
    }
    .ask {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 0.5px solid var(--line2);
      color: var(--tx3);
    }
    .ask:focus-within { border-bottom-color: var(--accent); }
    .ask input { flex: 1 1 auto; min-width: 0; font: inherit; color: var(--tx); background: transparent; border: 0; outline: none; padding: 7px 0; }
    .ask input::placeholder { color: var(--tx3); }
    .sample {
      font-family: var(--mono);
      font-size: 10px;
      padding: 1px 7px;
      border-radius: 99px;
      border: 0.5px dashed var(--line2);
      color: var(--tx3);
      white-space: nowrap;
    }
    .notice {
      font-size: 12px;
      color: var(--tx2);
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--accent-soft);
    }
    .kpis { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 10px; }
    .big { font-family: var(--mono); font-size: 34px; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
    .delta { font-family: var(--mono); font-size: 11px; color: var(--accent-tx); }
    .spark { display: block; width: 100%; height: 34px; margin-top: 6px; }
    .spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .meter { display: flex; align-items: center; gap: 8px; width: 44vw; max-width: 220px; }
    .bar { flex: 1 1 auto; height: 4px; border-radius: 99px; background: var(--line2); overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); }
    .meter .pct { font-family: var(--mono); font-size: 11px; width: 34px; text-align: right; color: var(--tx2); }
    .fix b { font-weight: 500; }
    .fix p { color: var(--tx2); margin-top: 4px; font-size: 12px; }
    @media (max-width: 560px) { .kpis { grid-template-columns: minmax(0, 1fr); } }

    /* ---------- Notice line: the last result or error, else the next step ---------- */
    .notice-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 12px 20px 0;
      font-size: 12px;
      line-height: 1.45;
      color: var(--tx);
    }
    .notice-line:empty { display: none; }
    .notice-line::before {
      content: "";
      flex: 0 0 auto;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      transform: translateY(-1px);
    }
    .notice-line.hint { color: var(--tx2); }
    .notice-line.hint::before { background: var(--line2); }
    .notice-line.error { color: var(--danger); }
    .notice-line.error::before { background: var(--danger); }

    /* ---------- Dock ---------- */
    .dock {
      position: sticky;
      bottom: 12px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 16px 12px;
      padding: 6px 6px 6px 16px;
      border-radius: 99px;
      background: var(--dock-bg);
      border: 0.5px solid var(--dock-line);
      color: var(--dock-tx);
    }
    .dock-group { display: flex; align-items: center; gap: 2px; }
    .dock .count { font-family: var(--mono); font-size: 12px; margin-right: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .dock .pending-btn { color: var(--dock-tx); }
    .dock .pending-btn svg { transition: transform 0.15s; }
    .dock .pending-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
    /* The unsaved list opens inside the dock, above its buttons: it moves with the dock however the dock wraps. */
    .dock.open { border-radius: 18px; }
    .pending-list {
      flex: 1 0 100%;
      order: -1;
      max-height: 40vh;
      overflow: auto;
      margin: 0 0 2px -10px;
      border-radius: 12px;
      background: var(--bg);
      color: var(--tx);
    }
    .db {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 99px;
      font-size: 12px;
      color: var(--dock-tx2);
      white-space: nowrap;
    }
    .db:hover { color: var(--dock-tx); background: var(--dock-hover); }
    .db.pri { background: var(--accent); color: var(--on-accent); font-weight: 500; box-shadow: var(--glow); }
    .db.pri:hover { filter: brightness(1.08); }
    .db:disabled { opacity: 0.4; cursor: default; background: transparent; }
    .db.pri:disabled { background: var(--accent); }

    @media (max-width: 560px) {
      .dock { border-radius: 18px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="orbit-clip" aria-hidden="true">
      <svg class="orbit" width="280" height="280" viewBox="0 0 280 280">
        <circle class="o1" cx="140" cy="140" r="118" fill="none" stroke-width="0.6" />
        <circle class="o2" cx="140" cy="140" r="78" fill="none" stroke-width="0.6" />
        <circle class="o4" cx="29" cy="100" r="14" />
        <circle class="o3" cx="29" cy="100" r="5" />
      </svg>
    </div>

    <header class="top">
      <div class="brand">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
          <circle class="logo-ring" cx="11" cy="14" r="9" fill="none" stroke-width="1.4" />
          <circle class="logo-dot" cx="19" cy="14" r="5" />
        </svg>
        <div style="min-width: 0">
          <h1>Schedule</h1>
          <p class="meta" id="summary">Waiting for Revit…</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-refresh" type="button" title="Reload from Revit" aria-label="Reload from Revit">
          <svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7" /><path d="M20 5v6h-6" /></svg>
        </button>
        <button class="icon-btn" id="btn-theme" type="button" title="Toggle light and dark" aria-label="Toggle light and dark">
          <svg class="i" id="theme-icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          <svg class="i" id="theme-icon-moon" viewBox="0 0 24 24" hidden><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg>
        </button>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab on" type="button" role="tab" data-tab="elements" aria-selected="true">
        Elements <span class="tab-count" id="tab-count-elements"></span>
      </button>
      <button class="tab" type="button" role="tab" data-tab="checks" aria-selected="false">
        Checks <span class="tab-count" id="tab-count-checks"></span>
      </button>
    </nav>

    <section class="panel" id="panel-elements" role="tabpanel">
      <div class="toolbar">
        <label class="search">
          <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
          <input id="filter-search" type="search" placeholder="Search elements" autocomplete="off" />
        </label>
        <label class="pick" title="Filter by level">
          <select id="filter-level" aria-label="Level"><option value="">All levels</option></select>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
        </label>
        <label class="pick" title="Filter by family">
          <select id="filter-family" aria-label="Family"><option value="">All families</option></select>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
        </label>
        <label class="pick" title="Filter by type">
          <select id="filter-type" aria-label="Type"><option value="">All types</option></select>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
        </label>
        <label class="pick" id="pick-link" title="Filter by linked model" hidden>
          <select id="filter-link" aria-label="Linked model"><option value="">All models</option></select>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
        </label>
        <button class="text-link" type="button" id="btn-clear-filters" hidden>Clear</button>
        <div class="pop-wrap" id="param-picker">
          <button class="pill" type="button" id="param-picker-trigger" aria-haspopup="listbox" aria-expanded="false">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16M9 5v14M15 5v14" /></svg>
            Columns<span class="pill-count" id="param-picker-label"></span>
          </button>
          <div class="popover" role="listbox" aria-multiselectable="true">
            <input id="param-picker-search" type="search" placeholder="Search parameters" autocomplete="off" />
            <div class="pop-actions">
              <button class="text-link" type="button" id="param-picker-all">select visible</button>
              <button class="text-link" type="button" id="param-picker-none">clear</button>
            </div>
            <ul class="ms-list" id="param-picker-list"></ul>
          </div>
        </div>
      </div>
      <div class="chips" id="chips"></div>
      <div id="table-container"></div>
    </section>

    <section class="panel" id="panel-checks" role="tabpanel" hidden>
      <div class="view" id="checks-view"></div>
    </section>

    <!-- What just happened (results, errors), or what to do next when nothing has. -->
    <p class="notice-line" id="status" role="status" aria-live="polite"></p>

    <footer class="dock">
      <div class="dock-group" id="dock-checks" hidden>
        <span class="count" id="checks-dock-label"></span>
        <button class="db pri" type="button" id="btn-run-checks">Run checks</button>
      </div>
      <div class="dock-group" id="dock-select">
        <span class="count" id="sel-count">0 in view</span>
        <button class="db" type="button" id="btn-show" title="Select and zoom to these elements in Revit">Show in Revit</button>
        <button class="db" type="button" id="btn-isolate" title="Hide everything else in the Revit view, then zoom">Isolate</button>
        <button class="db" type="button" id="btn-section" title="Section box around the checked elements" hidden>Section box</button>
        <button class="db" type="button" id="btn-reset-view" title="Undo Isolate: bring back the hidden elements">Reset view</button>
      </div>
      <section class="pending-list" id="pending-list" hidden aria-label="Changes not yet applied">
        <div class="changes" id="changes-list"></div>
      </section>
      <div class="dock-group" id="dock-pending" hidden>
        <button class="db pending-btn" type="button" id="btn-pending" aria-expanded="false" aria-controls="pending-list"></button>
        <button class="db" type="button" id="btn-discard">Discard</button>
        <button class="db pri" type="button" id="btn-apply">Apply to Revit</button>
      </div>
    </footer>
  </div>

  <div id="type-menu" role="listbox"></div>
  <div class="fill-badge" id="fill-badge" hidden></div>
  <script type="module" src="./src/mcp-app.ts"></script>
</body>
</html>
